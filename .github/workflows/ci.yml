name: CI

# Runs on:
#   - PRs targeting dev or main (gate before merge)
#   - Pushes to feature branches (developer convenience while iterating)
# Does NOT run on push to dev/main directly — that's CD's job.
on:
  pull_request:
    branches: [ dev, main ]
    types: [ opened, synchronize, reopened ]
  push:
    branches-ignore:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Tests are intentionally enabled here. Test failures fail the workflow.
      - name: Build and test with Gradle
        run: ./gradlew clean build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/*.jar
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
