spring:
  datasource:
    url: ${POSTGRE_url}
    username: ${POSTGRE_USERNAME}
    password: ${POSTGRE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # OSIV 비활성화(배포 차단 결함 수정): 기본 true 는 요청 수명 내내 JDBC 커넥션을 붙든다.
    # SSE 채팅 연결(수명 30분)이 커넥션 1개씩 30분 점유 → Hikari 풀(10) 고갈 → 동시 11명에서 전체 마비.
    # REST 는 JSON 직렬화가 서비스 트랜잭션 안에서 끝나므로 안전. (근거: .workbench/done_T11_T13_T14.md §8)
    open-in-view: false
    hibernate:
      # 스키마 소유권은 Flyway(V1__baseline)로 이관. Hibernate는 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  # Flyway: baseline 마이그레이션으로 스키마 소유. 모든 프로파일에 상속된다.
  flyway:
    enabled: true
    baseline-on-migrate: true   # 기존(비어있지 않은) DB엔 V1을 baseline으로 마킹만 하고 실행 안 함
    baseline-version: 1
    locations: classpath:db/migration

  jwt:
    secret: ${JWT_SECRET}

  security:
    oauth2:
      client:
        registration:
          # --- 1. 카카오 (Kakao) ---
          kakao:
            client-id: ${KAKAO_ID}
            client-secret: ${KAKAO_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname
            client-name: kakao

          # --- 2. 네이버 (Naver) ---
          naver:
            client-id: ${NAVER_ID}
            client-secret: ${NAVER_SECRET}
            redirect-uri: ${NAVER_REDIRECT_URI}
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
            client-name: Naver

          # --- 3. 구글 (Google) ---
          google:
            client-id: ${GOOGLE_ID}
            client-secret: ${GOOGLE_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile
            client-name: Google

          # --- 4. 애플 (Apple) ---
          apple:
            client-id: ${APPLE_SERVICE_ID}
            client-secret: ${APPLE_SECRET_KEY}
            redirect-uri: ${APPLE_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
            client-name: Apple

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id # 카카오는 보통 id를 식별자로 씀
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub # 애플은 사용자 식별자가 'sub'에 담김

# --- 애플 로그인을 위한 추가 설정 (OAuth2PropertiesValue 클래스용) ---
# 애플은 client-secret을 만들기 위해 아래 정보들이 추가로 필요
custom:
  oauth2:
    apple:
      client-id: ${APPLE_CLIENT_ID}
      team-id: ${APPLE_TEAM_ID}       # Apple Developer Team ID
      key-id: ${APPLE_KEY_ID}
      private-key: ${APPLE_PRIVATE_KEY}     # Key ID (P8 파일 발급 시 확인)

# --- Admin 자격증명 외부화 (핸드오프용) ---
# SecurityConfig.java 가 현재 'admin'/'admin1!' 를 하드코딩 중.
# Java 세션이 아래 프로퍼티를 @Value 로 읽도록 배선하면 하드코딩이 제거된다.
# 기본값은 두지 않는다 — 환경변수 미주입 시 노출을 막기 위함.
app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
