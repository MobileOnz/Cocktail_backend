spring:
  datasource:
    url: ${POSTGRE_url}
    username: ${POSTGRE_USERNAME}
    password: ${POSTGRE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # 개발 단계 추천, 운영 시 validate 또는 none
    properties:
      hibernate:
        format_sql: true

  jwt:
    secret: ${JWT_SECRET}

  security:
    oauth2:
      client:
        registration:
          # --- 1. 카카오 (Kakao) ---
          kakao:
            client-id: ${KAKAO_ID}
            client-secret: ${KAKAO_SECRET}
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname
            client-name: kakao

          # --- 2. 네이버 (Naver) ---
          naver:
            client-id: ${NAVER_ID}
            client-secret: ${NAVER_SECRET}
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
            client-name: Naver

          # --- 3. 구글 (Google) ---
          google:
            client-id: ${GOOGLE_ID}
            client-secret: ${GOOGLE_SECRET}
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile
            client-name: Google

          # --- 4. 애플 (Apple) ---
          apple:
            client-id: ${APPLE_SERVICE_ID}
            client-secret: ${APPLE_SECRET_KEY}
            redirect-uri: http://localhost:8080/login/oauth2/code/apple
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
            client-name: Apple

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id # 카카오는 보통 id를 식별자로 씀
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub # 애플은 사용자 식별자가 'sub'에 담김

# --- 애플 로그인을 위한 추가 설정 (OAuth2PropertiesValue 클래스용) ---
# 애플은 client-secret을 만들기 위해 아래 정보들이 추가로 필요
custom:
  oauth2:
    apple:
      team-id: ${APPLE_TEAM_ID}       # Apple Developer Team ID
      key-id: ${APPLE_KEY_ID}
      private-key: ${APPLE_PRIVATE_KEY}     # Key ID (P8 파일 발급 시 확인)
