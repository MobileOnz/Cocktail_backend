<!DOCTYPE>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Excel Manage</title>
</head>
<body>
    <h3>Excel Upload</h3>
    <form method="post" enctype="multipart/form-data" th:action="@{/admin/cocktail/excel/upload}">
        <input type="file" name="file" accept=".xlsx"/>
        <br>
        <br>
        <button type="submit">Upload</button>
    </form>

    <br>

    <h3>Excel Download</h3>
    <a href="/admin/cocktail/excel/download"> [Click] 저장된 칵테일 정보 엑셀파일 다운로드</a>
    <p th:if="${message}" th:text="${message}" style="color : green;"></p>
</body>
</html>
