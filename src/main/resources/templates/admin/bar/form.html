<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('바 편집 · ONZ Admin')}"></head>
<body>
<div class="wrap">
    <nav><a th:href="@{/admin/bars}">← 바 목록</a></nav>
    <h1 th:text="${mode == 'create'} ? '새 바' : '바 수정'">바</h1>

    <form class="card"
          th:attr="hx-post=${mode == 'create'} ? @{/admin/bars} : @{/admin/bars/{id}(id=${bar['id']})}"
          hx-target="#result" hx-swap="innerHTML">
        <p><label>slug (고유)<br/>
            <input type="text" name="slug" style="width:100%"
                   th:value="${bar['slug']}" th:readonly="${mode != 'create'}" required/></label></p>
        <p><label>이름(한글)<br/><input type="text" name="nameKo" style="width:100%"
                                     th:value="${bar['name_ko']}" required/></label></p>
        <p><label>이름(영문)<br/><input type="text" name="nameEn" style="width:100%"
                                     th:value="${bar['name_en']}"/></label></p>
        <p><label>주소<br/><input type="text" name="address" style="width:100%"
                                th:value="${bar['address']}"/></label></p>
        <p>
            <label>위도 <input type="number" step="0.0000001" name="lat" th:value="${bar['lat']}"/></label>
            &nbsp;<label>경도 <input type="number" step="0.0000001" name="lng" th:value="${bar['lng']}"/></label>
        </p>
        <p><label>전화 <input type="text" name="phone" th:value="${bar['phone']}"/></label></p>
        <p><label>대표 이미지 URL<br/><input type="text" name="heroImage" style="width:100%"
                                         th:value="${bar['hero_image']}"/></label></p>
        <p><label>상태
            <select name="status">
                <option th:each="s : ${ {'ACTIVE','CLOSED','HIDDEN'} }"
                        th:value="${s}" th:text="${s}"
                        th:selected="${bar['status'] != null and bar['status'] == s}">ACTIVE</option>
            </select></label></p>
        <p><label>설명<br/><textarea name="description" th:text="${bar['description']}"></textarea></label></p>
        <button type="submit" th:text="${mode == 'create'} ? '생성' : '저장'">저장</button>
    </form>
    <div id="result"></div>
</div>
</body>
</html>
