spring:
  datasource:
    # H2 in-memory. INIT 로 두 가지를 미리 만든다.
    #  1) JSONB 도메인 — Bar.hours 등이 columnDefinition="jsonb" 라 H2 가 타입을 모른다.
    #     스키마 생성(create-drop) 전에 JSON 별칭으로 등록해 컨텍스트 로딩을 통과시킨다.
    #  2) tag / magazine_article_tag — @Entity 가 없고 네이티브 쿼리로만 접근하는 조인 테이블이라
    #     ddl-auto 가 만들어 주지 않는다. 운영에선 Flyway 가 만들지만 여기선 Flyway 를 끈다.
    #     없으면 매거진 목록 조회가 "Table MAGAZINE_ARTICLE_TAG not found" 로 터진다.
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON\\;CREATE TABLE IF NOT EXISTS tag(id BIGINT PRIMARY KEY, name VARCHAR(255))\\;CREATE TABLE IF NOT EXISTS magazine_article_tag(article_id BIGINT NOT NULL, tag_id BIGINT NOT NULL)"
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # 테스트용: 매번 새로 생성
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway 비활성화(테스트 프로파일): 마이그레이션은 Postgres 문법이라 H2에서 실행 시
  # JdbcSQLSyntaxError 로 컨텍스트 로딩이 깨진다. 테스트는 ddl-auto:create-drop 로 스키마를
  # Hibernate 가 생성하므로 Flyway 가 불필요. (application.yml 의 flyway.enabled:true 를 오버라이드)
  flyway:
    enabled: false

  h2:
    console:
      enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG

# ---------------------------------------------------------------------------
# 테스트 전용 더미 시크릿/설정값.
# 운영은 시크릿을 환경변수로 외부화(${JWT_SECRET} 등)했기 때문에, @SpringBootTest 가
# 전체 컨텍스트를 부팅하려면 이 플레이스홀더들이 해석되어야 한다. 실제 값이 아닌
# 명백한 더미이며 테스트 리소스에만 존재한다. (실제 시크릿은 절대 커밋하지 않는다)
# ---------------------------------------------------------------------------
