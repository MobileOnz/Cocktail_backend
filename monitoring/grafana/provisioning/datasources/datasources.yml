# ===================================================
# Grafana Datasources Auto-provisioning
# Datasources are automatically configured on startup
# ===================================================

apiVersion: 1

datasources:
  # ==========================================
  # Prometheus (Metrics)
  # ==========================================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST

  # ==========================================
  # Loki (Logs)
  # ==========================================
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      timeout: 60
      derivedFields:
        # Link logs to traces (if using distributed tracing)
        - datasourceUid: tempo
          matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

# For production: Update URLs to actual endpoints
# - url: http://prometheus:9090 → https://prometheus.your-domain.com
# - url: http://loki:3100 → https://loki.your-domain.com
