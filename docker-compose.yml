version: '3.8'

services:
  # 1. API 서버 (Spring Boot) 서비스
  api-server:
    build: . # 현재 디렉토리의 Dockerfile을 사용해 이미지를 빌드
    container_name: cocktail-api
    expose:
      - "8080" # 내부 전용. nginx 가 프록시
    environment:
      # 🚨 API 서버가 도커 내부의 'db' 서비스에 접속하도록 설정
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_PROFILES_ACTIVE=docker # Dockerfile의 ENV와 일치

      # --- JWT 설정 ---
      - JWT_SECRET=${JWT_SECRET}

      # --- OAuth 설정 ---
      - KAKAO_ID=${KAKAO_ID}
      - KAKAO_SECRET=${KAKAO_SECRET}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      - NAVER_ID=${NAVER_ID}
      - NAVER_SECRET=${NAVER_SECRET}
      - NAVER_REDIRECT_URI=${NAVER_REDIRECT_URI}
      - GOOGLE_ID=${GOOGLE_ID}
      - GOOGLE_SECRET=${GOOGLE_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - APPLE_SERVICE_ID=${APPLE_SERVICE_ID}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
      - APPLE_REDIRECT_URI=${APPLE_REDIRECT_URI}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - APPLE_KEY_ID=${APPLE_KEY_ID}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY}
      - APPLE_AUDIENCE=${APPLE_AUDIENCE}
      - APPLE_PUBLIC_KEY_URL=${APPLE_PUBLIC_KEY_URL}
      - APPLE_TOKEN_URL=${APPLE_TOKEN_URL}

    depends_on:
      - db # 'db' 서비스가 먼저 실행된 후에 실행됨

  # 1.5. Nginx (reverse proxy + /uploads/* 정적 webp 서빙)
  #   - 80 포트 owner. /uploads/* 는 /var/onz/uploads 에서, 그 외는 api-server:8080 으로 프록시
  #   - /var/onz/uploads 는 EC2 호스트 디렉토리 (운영). 로컬 dev 는 mkdir 또는 .env 로 오버라이드.
  nginx:
    image: nginx:alpine
    container_name: nginx-onz
    ports:
      - "80:80"
    volumes:
      - ./nginx-onz.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/onz/uploads:/var/onz/uploads:ro
    depends_on:
      - api-server
    restart: unless-stopped

  # 2. PostgreSQL 서비스
  db:
    image: postgres
    container_name: postgres-cocktail
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql

  # 3. Redis 서비스
  redis:
    image: redis:7-alpine
    container_name: cocktail-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul

volumes:
  redis-data:
  postgres-data: